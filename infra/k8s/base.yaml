# DNS Shield Kubernetes baseline. Replace ghcr.io/example/dns-shield/* image tags
# through Kustomize or your deployment pipeline. All Services are ClusterIP by default.
apiVersion: v1
kind: Namespace
metadata:
  name: dns-shield
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-shield-config
  namespace: dns-shield
data:
  REDIS_URL: redis://redis:6379/0
  CLICKHOUSE_URL: http://clickhouse:8123
  GATEWAY_URL: http://api-gateway:8080
  ML_URL: http://ml-inference:8000
  BEHAVIOR_URL: http://behavioral-engine:8001
  GEO_URL: http://geo-intel:8002
  THREAT_INTEL_URL: http://threat-intel:8003
  ACTIVE_RESPONSE_URL: http://active-response:8004
  UPSTREAM_DNS: mock-dns:53
  SINKHOLE_IP: 10.200.0.250
  LAB_NETWORK_PREFIXES: 10.200.
  CORS_ORIGINS: https://REPLACE_WITH_APPROVED_DASHBOARD_URL
  GATEWAY_RATE_LIMIT_PER_MINUTE: "240"
  TRUST_PROXY_HEADERS: "false"
  METRICS_PUBLIC: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: dns-shield-secrets-template
  namespace: dns-shield
type: Opaque
stringData:
  # Replace through managed secrets; do not commit live values.
  GATEWAY_API_KEY: REPLACE_ME
  OTX_API_KEY: ""
  MISP_URL: ""
  MISP_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: dns-shield}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 3}
          volumeMounts: [{name: redis-data, mountPath: /data}]
      volumes: [{name: redis-data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: dns-shield}
spec: {selector: {app: redis}, ports: [{port: 6379, targetPort: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: clickhouse, namespace: dns-shield}
spec:
  replicas: 1
  selector: {matchLabels: {app: clickhouse}}
  template:
    metadata: {labels: {app: clickhouse}}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          ports: [{containerPort: 8123}]
          readinessProbe: {httpGet: {path: /ping, port: 8123}, initialDelaySeconds: 10, periodSeconds: 10}
          volumeMounts: [{name: clickhouse-data, mountPath: /var/lib/clickhouse}]
      volumes: [{name: clickhouse-data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: clickhouse, namespace: dns-shield}
spec: {selector: {app: clickhouse}, ports: [{port: 8123, targetPort: 8123}]}
---
# One private Deployment/Service pair for each Python service. Images should be
# produced by CI and immutable-tagged before using this manifest.
apiVersion: apps/v1
kind: Deployment
metadata: {name: threat-intel, namespace: dns-shield}
spec:
  replicas: 1
  selector: {matchLabels: {app: threat-intel}}
  template:
    metadata: {labels: {app: threat-intel}}
    spec:
      containers:
        - name: threat-intel
          image: ghcr.io/example/dns-shield/threat-intel:REPLACE_ME
          envFrom: [{configMapRef: {name: dns-shield-config}}, {secretRef: {name: dns-shield-secrets-template}}]
          ports: [{containerPort: 8003}]
          readinessProbe: {httpGet: {path: /feeds/health, port: 8003}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: threat-intel, namespace: dns-shield}
spec: {selector: {app: threat-intel}, ports: [{port: 8003, targetPort: 8003}]}
---
